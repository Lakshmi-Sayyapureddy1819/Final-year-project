  <path d="M290 247 L380 247" class="arrow"/>
  <path d="M290 362 L380 280" class="arrow"/>
  <path d="M290 477 L380 280" class="arrow"/>

  <path d="M530 315 L530 365" class="arrow"/>
  <path d="M680 415 L790 152" class="arrow"/>
  <path d="M680 415 L790 277" class="arrow"/>
  <path d="M680 415 L790 402" class="arrow"/>

