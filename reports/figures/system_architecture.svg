<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: bold 28px 'Times New Roman', serif; fill: #1d3557; }
      .box { fill: #f8fbff; stroke: #264653; stroke-width: 2.5; rx: 14; ry: 14; }
      .box2 { fill: #eef6ea; stroke: #2a9d8f; stroke-width: 2.5; rx: 14; ry: 14; }
      .box3 { fill: #fff4e6; stroke: #e76f51; stroke-width: 2.5; rx: 14; ry: 14; }
      .txt { font: 22px 'Times New Roman', serif; fill: #222; }
      .small { font: 20px 'Times New Roman', serif; fill: #222; }
      .arrow { stroke: #444; stroke-width: 3.2; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#444"/>
    </marker>
