  <rect x="40" y="205" width="250" height="85" class="box"/>
  <text x="76" y="250" class="txt">NOAA SST Data</text>

  <rect x="40" y="320" width="250" height="85" class="box"/>
  <text x="54" y="365" class="txt">FishBase Maturity Data</text>

  <rect x="40" y="435" width="250" height="85" class="box"/>
  <text x="55" y="480" class="txt">PFZ / Field Observations</text>

  <rect x="380" y="195" width="300" height="120" class="box2"/>
